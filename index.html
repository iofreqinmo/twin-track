<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twin Track</title>
  <meta name="description" content="Track feeding and diapers for twins.">
  <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Twin Track">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Twin Track <span id="offline" class="pill" hidden>Offline · will sync</span></h1>
    <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙︎</button>
  </header>

  <main>
    <section id="cards" class="cards" aria-label="Babies"></section>

    <section class="history">
      <h2>History</h2>
      <div class="history-head">
        <div id="view" class="seg small" role="group" aria-label="View">
          <button type="button" data-view="today">Today</button>
          <button type="button" data-view="week">Last 7 days</button>
        </div>
        <div id="filter" class="seg small" role="group" aria-label="Filter by baby"></div>
      </div>
      <div id="history-content"></div>
    </section>
  </main>

  <!-- Add / edit entry -->
  <dialog id="entry-dialog">
    <form id="entry-form" method="dialog">
      <h2 id="entry-title">Log</h2>

      <fieldset>
        <legend>Who</legend>
        <div id="who" class="chips"></div>
      </fieldset>

      <section id="feed-section" class="sheet-section">
        <h3>🍼 Feeding</h3>
        <div class="seg" data-field="method" aria-label="Feeding">
          <button type="button" data-value="none">None</button>
          <button type="button" data-value="bottle">Bottle</button>
          <button type="button" data-value="breast">Breast</button>
          <button type="button" data-value="combo">Combo</button>
        </div>

        <div data-show="method=breast|combo" class="sheet-fields">
          <fieldset>
            <legend>Side</legend>
            <div class="seg" data-field="side">
              <button type="button" data-value="L">Left</button>
              <button type="button" data-value="R">Right</button>
              <button type="button" data-value="LR">Both</button>
            </div>
          </fieldset>
          <label class="field">
            <span>Breast duration (minutes)</span>
            <input id="minutes" type="number" inputmode="numeric" min="0" step="1">
          </label>
        </div>

        <div data-show="method=bottle|combo" class="sheet-fields">
          <label class="field" for="amount">
            <span>Bottle amount (<span class="unit-label">ml</span>)</span>
          </label>
          <div class="stepper">
            <button type="button" data-step="-1" aria-label="Less">−</button>
            <input id="amount" type="number" inputmode="decimal" min="0">
            <button type="button" data-step="1" aria-label="More">+</button>
          </div>
          <div class="amount-presets" id="amount-presets"></div>
          <p id="who-hint" class="hint" hidden>Amount is per baby.</p>
          <fieldset>
            <legend>Contents</legend>
            <div class="seg" data-field="milk">
              <button type="button" data-value="breastmilk">Breast milk</button>
              <button type="button" data-value="formula">Formula</button>
            </div>
          </fieldset>
        </div>

      </section>

      <section id="diaper-section" class="sheet-section">
        <h3>🧷 Diaper</h3>
        <div class="seg" data-field="diaper" aria-label="Diaper">
          <button type="button" data-value="none">None</button>
          <button type="button" data-value="wet">💧 Pee</button>
          <button type="button" data-value="dirty">💩 Poop</button>
          <button type="button" data-value="both">Both</button>
        </div>
      </section>

      <label class="field">
        <span>Time</span>
        <input id="time" type="datetime-local" required>
      </label>

      <label class="field">
        <span>Note</span>
        <input id="note" type="text" placeholder="Optional" maxlength="200">
      </label>

      <div class="actions">
        <button type="button" id="delete-btn" class="btn danger" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="settings-dialog">
    <form id="settings-form" method="dialog">
      <h2>Settings</h2>

      <fieldset>
        <legend>Babies</legend>
        <div id="baby-settings"></div>
      </fieldset>

      <fieldset>
        <legend>Bottle units</legend>
        <div class="seg" data-field="unit">
          <button type="button" data-value="ml">ml</button>
          <button type="button" data-value="oz">oz</button>
        </div>
      </fieldset>

      <fieldset id="account" hidden>
        <legend>Account</legend>
        <p class="hint" id="account-email"></p>
        <button type="button" class="btn secondary" id="signout-btn">Sign out</button>
      </fieldset>

      <fieldset>
        <legend>Data</legend>
        <p class="hint" id="storage-hint">Entries are saved only on this device. Export a backup now and then.</p>
        <p class="hint">App version <span id="app-version"></span></p>
        <div class="data-btns">
          <button type="button" class="btn secondary" id="export-json">Export backup</button>
          <button type="button" class="btn secondary" id="import-json">Import backup</button>
          <button type="button" class="btn secondary" id="export-csv">Export CSV</button>
          <button type="button" class="btn danger" id="clear-data">Erase all</button>
        </div>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </fieldset>

      <div class="actions">
        <span class="spacer"></span>
        <button type="submit" class="btn primary">Done</button>
      </div>
    </form>
  </dialog>

  <!-- Shown in cloud mode until a family member signs in -->
  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <img src="icons/icon.svg" alt="" width="72" height="72">
      <h2>Twin Track</h2>
      <p id="gate-msg"></p>
      <button type="button" id="signin-btn" class="btn primary">Sign in with Google</button>
      <button type="button" id="switch-btn" class="btn secondary" hidden>Use a different account</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
